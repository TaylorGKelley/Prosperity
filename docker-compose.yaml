services:
  database:
    image: postgres:latest
    container_name: prosperity-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: prosperity
      POSTGRES_USER: prospering
      POSTGRES_PASSWORD: paonapowgnzjog!fa4p
    ports:
      - '7700:7700'
    volumes:
      - prosperity-database:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tayLabAuth -d auth']
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - 'development'

volumes:
  prosperity-database:
